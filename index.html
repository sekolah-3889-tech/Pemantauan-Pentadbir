```html
<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pemantauan Pentadbir | SAKTI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="login-card">

            <!-- LOGO SEKOLAH -->
            <img
                src="LOGO_SAKTI.png"
                alt="Logo Sekolah"
                class="logo"
            >

            <h1>PEMANTAUAN PENTADBIR</h1>

            <p class="school">
                SEKOLAH MENENGAH SAINS KOTA TINGGI
            </p>

            <p class="subtitle">
                Portal Akses Pentadbir
            </p>


            <!-- LOGIN -->

            <div class="form">

                <label for="username">
                    ID Pengguna
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan ID pengguna"
                >


                <label for="password">
                    Kata Laluan
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan kata laluan"
                >


                <button onclick="login()">
                    LOG MASUK
                </button>

            </div>


            <!-- MESEJ -->

            <p id="message"></p>


            <div class="security">
                🔒 Akses terhad kepada pentadbir
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
