```html
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Pemantauan Pentadbir | SAKTI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">

        <div class="login-container">

            <!-- LOGO -->
            <div class="logo-container">
                <img src="LOGO_SAKTI.png" alt="Logo SAKTI" class="logo">
            </div>

            <!-- TAJUK -->
            <h1>PEMANTAUAN PENTADBIR</h1>

            <p class="school-name">
                SEKOLAH MENENGAH SAINS KOTA TINGGI
            </p>

            <p class="description">
                Portal khas untuk akses sistem pemantauan pentadbir.
            </p>

            <!-- LOGIN BOX -->
            <div class="login-box">

                <h2>Log Masuk</h2>

                <div class="input-group">
                    <label for="username">ID Pengguna</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan ID pengguna"
                        autocomplete="off"
                    >
                </div>

                <div class="input-group">
                    <label for="password">Kata Laluan</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan kata laluan"
                    >
                </div>

                <button onclick="login()" class="login-button">
                    LOG MASUK
                </button>

                <!-- MESEJ -->
                <p id="message"></p>

            </div>

            <p class="security">
                🔒 Akses terhad kepada pentadbir yang dibenarkan.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
